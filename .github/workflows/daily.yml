name: Daily AI Insight Update

on:
  schedule:
    # ⏰ 定时任务：每天 UTC 时间 01:00 (即北京时间 09:00)
    - cron: '0 1 * * *'
  # 👇 允许你在 GitHub 页面上手动点击按钮触发 (方便测试)
  workflow_dispatch:

permissions:
  contents: write  # 允许脚本修改仓库代码 (为了推送 news.json)

jobs:
  build-and-run:
    runs-on: ubuntu-latest  # 使用 GitHub 的 Linux 服务器
    timeout-minutes: 15     # 防止某步卡死超过 15 分钟

    steps:
      - name: 📥 Checkout Code (拉取代码)
        uses: actions/checkout@v4

      - name: 🐍 Set up Python (安装 Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 开启缓存，加速安装

      - name: 📦 Install Dependencies (安装依赖)
        run: |
          pip install -r python_backend/requirements.txt

      - name: 🔐 Validate Secrets (校验配置)
        run: |
          if [ -z "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "::error::请在 Repo Settings → Secrets 中配置 GROQ_API_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.TAVILY_API_KEY }}" ]; then
            echo "::error::请配置 TAVILY_API_KEY"
            exit 1
          fi
          echo "✅ 必要 Secrets 已配置 (GROQ_API_KEY + TAVILY_API_KEY)"

      - name: 🚀 Run Agent (执行抓取)
        env:
          # 🔑 必须使用「公网可访问」的 LLM API（GitHub 在美国，无法访问内网网关）
          # 推荐：OpenAI / Groq / Together.ai / Anyscale 等
          MY_API_KEY: ${{ secrets.MY_API_KEY }}
          MY_BASE_URL: ${{ secrets.MY_BASE_URL }}
          MY_MODEL_NAME: ${{ secrets.MY_MODEL_NAME }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LOCAL_VPN: ""
        run: |
          python python_backend/agent_graph.py

      - name: 📤 Commit and Push (推送数据)
        run: |
          # 配置 Git 身份 (GitHub 机器人)
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 检查 news.json 是否有变化
          git add data/news.json
          
          # 如果有变化就提交，没变化就不报错
          git commit -m "chore(bot): update daily news [skip ci]" || echo "No changes to commit"
          git push